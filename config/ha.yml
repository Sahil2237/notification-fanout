redis:
  sentinels: ${REDIS_SENTINELS}
  user: limiter
  password: ${REDIS_PASSWORD}
  sentinelUser: discovery
  sentinelPassword: ${REDIS_SENTINEL_PASSWORD}
  tls: true
  requiredReplicas: 1
production: true
adminToken: ${ADMIN_TOKEN}
singleHostDeployment: false
requireReplicaReads: true
database:
  driverClass: org.postgresql.Driver
  url: ${DB_URL}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  initialSize: 1
  minSize: 1
  maxSize: ${DB_WRITE_POOL_MAX:-8}
  validationQuery: SELECT 1 / ((NOT pg_is_in_recovery())::int)
  checkConnectionOnBorrow: true
  validationInterval: 1 second
  validationQueryTimeout: 2 seconds
  maxWaitForConnection: 3 seconds
  maxConnectionAge: 60 seconds
  properties:
    reWriteBatchedInserts: 'true'
    sslmode: verify-full
    targetServerType: primary
    hostRecheckSeconds: 2
    connectTimeout: 3
    socketTimeout: 10
    options: -c statement_timeout=5000 -c lock_timeout=3000
readDatabase:
  driverClass: org.postgresql.Driver
  url: ${DB_URL}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  initialSize: 0
  minSize: 0
  maxSize: ${DB_READ_POOL_MAX:-4}
  validationQuery: SELECT 1 / (pg_is_in_recovery()::int)
  checkConnectionOnBorrow: true
  validationInterval: 50 milliseconds
  validationQueryTimeout: 2 seconds
  maxWaitForConnection: 3 seconds
  maxConnectionAge: 60 seconds
  properties:
    reWriteBatchedInserts: 'true'
    sslmode: verify-full
    targetServerType: secondary
    loadBalanceHosts: 'true'
    readOnly: 'true'
    hostRecheckSeconds: 2
    connectTimeout: 3
    socketTimeout: 10
    options: -c statement_timeout=5000 -c lock_timeout=3000
subscriberConcurrency: ${SUBSCRIBER_CONCURRENCY:-1}
userIds:
  service: ${SERVICE_USER_ID:-service}
compartmentIds:
  service: ${SERVICE_COMPARTMENT_ID:-default}
credentials:
  service: ${API_TOKEN}
allowedWebhookOrigins: ${WEBHOOK_ORIGINS}
allowLocalWebhooks: false
signingSecret: ${WEBHOOK_SIGNING_SECRET}
workerEnabled: ${WORKER_ENABLED:-true}
workerThreads: ${WORKER_THREADS:-4}
maxAttempts: 6
leaseSeconds: 30
requestTimeoutSeconds: 5
retryBaseMillis: 1000
retryCapMillis: 60000
requestsPerMinute: ${REQUESTS_PER_MINUTE:-6000}
requestsPerSecond: ${REQUESTS_PER_SECOND:-1000}
tenantCredentialsEnvironment: TENANT_CREDENTIALS
kafka:
  enabled: true
  publisherEnabled: ${KAFKA_PUBLISHER_ENABLED:-true}
  consumerEnabled: ${KAFKA_CONSUMER_ENABLED:-true}
  bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
  topic: notification-events-v1
  groupId: notification-dispatch-v1
  securityProtocol: SSL
  publisherThreads: 1
server:
  type: bounded
  applicationConnectors:
    - type: http
      port: 8080
      bindHost: 127.0.0.1
  adminConnectors:
    - type: http
      bindHost: 127.0.0.1
      port: 8081
logging:
  level: INFO
  loggers:
    org.apache.kafka: WARN
  appenders:
    - type: console
      layout:
        type: json
        includesMdcKeys: [event_id, tenant_id]
        flattenMdc: true

# Optional metrics-only DigitalOcean Insights export. No alarms or ticketing.
telemetry:
  enabled: ${METRICS_ENABLED:-false}
  dropletId: "${DO_DROPLET_ID:-}"
  teamId: "${DO_TEAM_ID:-}"
  region: blr1
  endpoint: https://otlp-insights-blr1.digitalocean.com/v1/metrics
  tokenEnvironment: DO_METRICS_INGEST_TOKEN
  intervalSeconds: 60

cache:
  enabled: ${CACHE_ENABLED:-true}
  eventTtlSeconds: 300
  subscriptionPercent: 20
  maxBytes: ${CACHE_MAX_BYTES:-33554432}
  maxEntries: ${CACHE_MAX_ENTRIES:-50000}
deliveryHotRetentionHours: 24
archiveBatchSize: 100
