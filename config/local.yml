adminToken: ${ADMIN_TOKEN:-local-admin-token-change-me-32-characters}
database:
  driverClass: org.postgresql.Driver
  url: ${DB_URL:-jdbc:postgresql://notification-db:5432/notifications}
  user: ${DB_USER:-notifications}
  password: ${DB_PASSWORD:-local-only-change-me}
  minSize: 2
  maxSize: 16
  validationQuery: SELECT 1
  properties:
    connectTimeout: 3
    socketTimeout: 10
    options: -c statement_timeout=5000 -c lock_timeout=3000
credentials:
  demo: ${API_TOKEN:-local-demo-token-change-me}
  other: ${OTHER_API_TOKEN:-local-other-token-change-me}
allowedWebhookOrigins:
  - http://127.0.0.1:9090
allowLocalWebhooks: true
signingSecret: ${WEBHOOK_SIGNING_SECRET:-local-signing-secret-change-me}
workerEnabled: ${WORKER_ENABLED:-true}
workerThreads: 8
maxAttempts: 5
leaseSeconds: 30
requestTimeoutSeconds: 5
retryBaseMillis: 1000
retryCapMillis: 60000
requestsPerMinute: ${REQUESTS_PER_MINUTE:-6000}
server:
  applicationConnectors:
    - type: http
      port: 8080
  adminConnectors:
    - type: http
      port: 8081
logging:
  level: INFO
  appenders:
    - type: console
      layout:
        type: json

kafka:
  enabled: true
  bootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-notification-kafka:9092}
  topic: ${KAFKA_TOPIC:-notification-events-v1}
  groupId: ${KAFKA_GROUP_ID:-notification-dispatch-v1}
  publisherEnabled: ${KAFKA_PUBLISHER_ENABLED:-true}
  consumerEnabled: ${KAFKA_CONSUMER_ENABLED:-true}
