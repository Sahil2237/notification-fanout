name: notifications
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-app-env: &app-env
  DB_URL: jdbc:postgresql://db:5432/notifications
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  DB_USER: notification_runtime
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
  API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
  ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?Set WEBHOOK_SIGNING_SECRET}
  WEBHOOK_ORIGINS: ${WEBHOOK_ORIGINS:?Set a JSON array of HTTPS origins}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
services:
  redis:
    image: redis:8.10.3
    user: '999:999'
    restart: unless-stopped
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        printf 'bind 0.0.0.0\nprotected-mode yes\nrequirepass %s\nmaxmemory 64mb\nmaxmemory-policy noeviction\nappendonly yes\nappendfsync always\ndir /data\n' "$$REDIS_PASSWORD" > /tmp/notification-redis.conf
        exec redis-server /tmp/notification-redis.conf
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 2s
      retries: 30
    logging: *logging
  db:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification_owner
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD:?Set PG_OWNER_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/001-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U notification_owner -d notifications']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    mem_limit: 1152m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 134217728
      KAFKA_LOG_SEGMENT_BYTES: 33554432
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging: *logging
  kafka-init:
    image: apache/kafka:4.3.2
    profiles: [tools]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in notification-events-v1 notification-deliveries-dlq-v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 6 --replication-factor 1
        done
  migrate:
    image: ${APP_IMAGE:?Set APP_IMAGE to the tested image}
    profiles: [tools]
    environment:
      <<: *app-env
      DB_USER: notification_owner
      DB_PASSWORD: ${PG_OWNER_PASSWORD:?Set PG_OWNER_PASSWORD}
    command: [db, migrate, /opt/app/droplet.yml]
    mem_limit: 896m
    logging: *logging
  grants:
    image: postgres:17
    profiles: [tools]
    environment:
      PGHOST: db
      PGUSER: notification_owner
      PGDATABASE: notifications
      PGPASSWORD: ${PG_OWNER_PASSWORD:?Set PG_OWNER_PASSWORD}
    volumes:
      - ./grants.sql:/grants.sql:ro
    entrypoint: [psql, -v, ON_ERROR_STOP=1, -f, /grants.sql]
    logging: *logging
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to the tested image}
    restart: unless-stopped
    environment: *app-env
    command: [server, /opt/app/droplet.yml]
    mem_limit: 896m
    stop_grace_period: 45s
    ports:
      - 127.0.0.1:8080:8080
    logging: *logging
  proxy:
    image: caddy:2.11.9-alpine
    profiles: [public]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-localhost}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - caddy-config:/config
    logging: *logging
volumes:
  redis:
  postgres:
  kafka:
  caddy:
  caddy-config:
