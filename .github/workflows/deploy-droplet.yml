name: Deploy verified revision to Droplet
on:
  workflow_run:
    workflows: [Java 25 verification]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: droplet-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DROPLET_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DROPLET_HOST: ${{ vars.DROPLET_HOST }}
    steps:
      - name: Download the artifact from the successful verification run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: droplet-release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check the tested revision and artifact checksums
        run: |
          test "$(cat release/release-sha)" = "$RELEASE_SHA"
          (cd release && sha256sum --check SHA256SUMS)
          test -s release/SHA256SUMS.sig
      - name: Set up restricted SSH credentials and pinned server identity
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts
      - name: Transfer and promote the signed tested artifact
        run: |
          [[ "$DROPLET_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="/home/notification-deploy/incoming/$RELEASE_SHA"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "notification-deploy@$DROPLET_HOST" "umask 077; mkdir -p '$destination'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes release/* "notification-deploy@$DROPLET_HOST:$destination/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "notification-deploy@$DROPLET_HOST" "sudo /usr/local/sbin/notification-promote '$RELEASE_SHA'"
          printf 'Deployed tested revision `%s` from verification run `%s`.\n' "$RELEASE_SHA" '${{ github.event.workflow_run.id }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
