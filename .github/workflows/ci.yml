name: Java 25 verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.10.3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      kafka:
        image: apache/kafka:4.3.2
        ports:
          - 9094:9094
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: notifications_test
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_REDIS_HOST: localhost
      TEST_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
      TEST_DB_URL: jdbc:postgresql://localhost:5432/notifications_test
      DB_USER: notifications
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp verify
      - run: python3 -m unittest discover -s deploy/droplet -p 'test_*.py' -v
      - run: python3 -m unittest discover -s deploy/ha -p 'test_*.py' -v
      - name: Validate HA application configuration
        env:
          DB_URL: jdbc:postgresql://10.122.0.1:5432,10.122.0.2:5432,10.122.0.3:5432/notifications
          REDIS_SENTINELS: '["10.122.0.1:26379","10.122.0.2:26379","10.122.0.3:26379"]'
          REDIS_PASSWORD: ci-redis-credential-at-least-32-characters
          REDIS_SENTINEL_PASSWORD: ci-sentinel-credential-at-least-32-characters
          DB_USER: notification_runtime
          DB_PASSWORD: ci-runtime-credential-at-least-32-characters
          API_TOKEN: ci-tenant-credential-at-least-32-characters
          ADMIN_TOKEN: ci-admin-credential-at-least-32-characters
          WEBHOOK_SIGNING_SECRET: ci-signing-secret-at-least-32-characters
          WEBHOOK_ORIGINS: '["https://example.com"]'
          KAFKA_BOOTSTRAP_SERVERS: 10.122.0.1:9092,10.122.0.2:9092,10.122.0.3:9092
        run: java -jar target/notification-fanout.jar check config/ha.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-application
          path: target/notification-fanout.jar
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  tested-release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_IMAGE: notification-fanout:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the release image once
        run: docker build --platform linux/amd64 --target runtime --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$APP_IMAGE" .
      - name: Scan fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.APP_IMAGE }}
          format: json
          output: security-report.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Validate the public HTTPS proxy configuration
        run: docker run --rm -e TLS_DOMAIN=example.com -v "$PWD/deploy/droplet/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify real services and runtime database permissions
        run: bash deploy/droplet/smoke.sh
      - name: Verify failed-release rollback and backup restore
        run: sudo --preserve-env=APP_IMAGE,GITHUB_SHA,GITHUB_ACTIONS bash deploy/droplet/test-release.sh
      - name: Package the exact tested image
        run: |
          mkdir -p .release
          cp deploy/droplet/{compose.yaml,init-db.sh,grants.sql,Caddyfile,release.sh,backup.sh,verify-image.py,ha-release.sh} .release/
          python3 deploy/droplet/pin-images.py .release/compose.yaml
          docker save "$APP_IMAGE" | gzip > .release/image.tar.gz
          docker image inspect "$APP_IMAGE" --format '{{.Id}}' > .release/image-id
          printf '%s\n' "$GITHUB_SHA" > .release/release-sha
          cd .release
          sha256sum image.tar.gz image-id release-sha compose.yaml init-db.sh grants.sql Caddyfile release.sh backup.sh verify-image.py ha-release.sh > SHA256SUMS
      - name: Sign a trusted default-branch release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.DROPLET_HOST != ''
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          test -n "$RELEASE_SIGNING_KEY"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing.pem"
          trap 'rm -f "$RUNNER_TEMP/release-signing.pem"' EXIT
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-signing.pem" -rawin -in .release/SHA256SUMS -out .release/SHA256SUMS.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droplet-release
          path: .release/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-report
          path: security-report.json

  ha-runtime:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HA_TOOLS_IMAGE: notification-ha-tools:${{ github.sha }}
      HA_PROXY_IMAGE: notification-ha-proxy:${{ github.sha }}
      ETCD_IMAGE: gcr.io/etcd-development/etcd:v3.7.4
      KAFKA_IMAGE: notification-kafka:${{ github.sha }}
      REDIS_IMAGE: notification-redis:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verification-application
          path: target
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '25'
      - name: Build HA database and backup tools
        run: docker build --platform linux/amd64 -t "$HA_TOOLS_IMAGE" -f deploy/ha/Dockerfile deploy/ha
      - name: Verify real three-node synchronous PostgreSQL failover
        run: sudo --preserve-env=GITHUB_ACTIONS,HA_TOOLS_IMAGE,ETCD_IMAGE env HA_APPLICATION_JAR="$PWD/target/notification-fanout.jar" python3 deploy/ha/test-postgres-cluster.py
      - name: Build patched Redis and Sentinel
        run: docker build --platform linux/amd64 -t "$REDIS_IMAGE" -f deploy/ha/Dockerfile.redis deploy/ha
      - name: Verify Redis TLS, shared quota and automatic Sentinel failover
        run: sudo --preserve-env=GITHUB_ACTIONS,REDIS_IMAGE env HA_APPLICATION_JAR="$PWD/target/notification-fanout.jar" python3 deploy/ha/test-redis-cluster.py
      - name: Scan Redis and Sentinel image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          image-ref: ${{ env.REDIS_IMAGE }}
          format: json
          output: ha-redis-security.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build distributed HTTPS proxy
        run: docker build --platform linux/amd64 -t "$HA_PROXY_IMAGE" -f deploy/ha/Dockerfile.caddy deploy/ha
      - name: Validate HA HTTPS and draining routes
        run: docker run --rm -e TLS_DOMAIN=example.com -e CADDY_DATABASE_DSN=postgres://caddy:ci-only@127.0.0.1/caddy -v "$PWD/deploy/ha/Caddyfile:/etc/caddy/Caddyfile:ro" "$HA_PROXY_IMAGE" caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
      - name: Scan HA database and backup tools
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.HA_TOOLS_IMAGE }}
          format: json
          output: ha-tools-security.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan HA proxy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          image-ref: ${{ env.HA_PROXY_IMAGE }}
          format: json
          output: ha-proxy-security.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Build patched Kafka broker
        run: docker build --platform linux/amd64 -t "$KAFKA_IMAGE" -f deploy/ha/Dockerfile.kafka deploy/ha
      - name: Scan Kafka broker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          image-ref: ${{ env.KAFKA_IMAGE }}
          format: json
          output: ha-kafka-security.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan etcd quorum image
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.2
          image-ref: ${{ env.ETCD_IMAGE }}
          format: json
          output: ha-etcd-security.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Package pinned HA runtime
        run: bash deploy/ha/package-runtime.sh
      - name: Sign trusted HA infrastructure artifact
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/ha-signing.pem"
          trap 'rm -f "$RUNNER_TEMP/ha-signing.pem"' EXIT
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/ha-signing.pem" -rawin -in .ha-runtime/SHA256SUMS -out .ha-runtime/SHA256SUMS.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ha-runtime
          path: .ha-runtime/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ha-security-reports
          path: ha-*-security.json
