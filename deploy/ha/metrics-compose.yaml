name: notification-metrics
services:
  exporter:
    image: ${METRICS_IMAGE:?Use the exact verified image digest}
    entrypoint: [java, -Xms32m, -Xmx96m, -XX:MaxMetaspaceSize=96m, -cp, /opt/app/notification-fanout.jar, com.example.notifications.MetricsBridge]
    user: '10001:10001'
    network_mode: host
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [./metrics.env]
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
