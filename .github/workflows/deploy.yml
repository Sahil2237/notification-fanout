name: Deploy verified revision to DigitalOcean
on:
  workflow_run:
    workflows: ["Java 25 verification"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DIGITALOCEAN_APP_ID != ''
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DOCR_REGISTRY: ${{ vars.DOCR_REGISTRY }}
      APP_ID: ${{ vars.DIGITALOCEAN_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Build and publish the tested revision
        run: |
          test -n "$DOCR_REGISTRY"
          doctl registry login --expiry-seconds 600
          image="registry.digitalocean.com/$DOCR_REGISTRY/notification-fanout:$RELEASE_SHA"
          docker build --target runtime -t "$image" .
          docker push "$image"
      - name: Update all components to that revision
        run: |
          umask 077
          doctl apps get "$APP_ID" --output json > /tmp/current-app.json
          python3 - <<'PYCODE'
          import json, os
          data=json.load(open('/tmp/current-app.json'))
          app=data[0] if isinstance(data,list) else data
          spec=app['spec']
          for kind in ('services','workers','jobs'):
              for component in spec.get(kind,[]):
                  component['image']['tag']=os.environ['RELEASE_SHA']
          with open('/tmp/release-spec.json','w') as stream: json.dump(spec,stream)
          PYCODE
          doctl apps update "$APP_ID" --spec /tmp/release-spec.json --wait
