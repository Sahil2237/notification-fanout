name: Deploy verified revision to three HA nodes
on:
  workflow_run:
    workflows: [Java 25 verification]
    types: [completed]
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Successful trusted default-branch verification run
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: droplet-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.HA_ENABLED == 'true' && vars.HA_DEPLOY_READY == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERIFICATION_RUN_ID: ${{ github.event.workflow_run.id || inputs.verification_run_id }}
    steps:
      - name: Validate exact trusted verification run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$VERIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$VERIFICATION_RUN_ID" > verified-run.json
          jq -e --arg repository "$GH_REPO" --arg branch "$DEFAULT_BRANCH" '.conclusion == "success" and .event == "push" and .head_branch == $branch and .head_repository.full_name == $repository' verified-run.json
          sha=$(jq -r .head_sha verified-run.json)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'RELEASE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: droplet-release
          path: release
          run-id: ${{ env.VERIFICATION_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify bundle revision and checksums
        run: |
          test "$(cat release/release-sha)" = "$RELEASE_SHA"
          (cd release && sha256sum --check SHA256SUMS)
          test -s release/SHA256SUMS.sig
      - name: Prepare restricted SSH access
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Drain and promote one node at a time
        env:
          HA_HOSTS: ${{ vars.HA_DROPLET_HOSTS }}
        run: |
          jq -e 'type == "array" and length == 3 and (unique | length) == 3 and all(.[]; type == "string" and test("^[a-zA-Z0-9][a-zA-Z0-9.-]*$"))' <<< "$HA_HOSTS"
          mapfile -t hosts < <(jq -r '.[]' <<< "$HA_HOSTS")
          for host in "${hosts[@]}"; do
            destination="/home/notification-deploy/incoming/$RELEASE_SHA"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "notification-deploy@$host" "umask 077; mkdir -p '$destination'"
            scp -o BatchMode=yes -o StrictHostKeyChecking=yes release/* "notification-deploy@$host:$destination/"
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "notification-deploy@$host" "sudo /usr/local/sbin/notification-promote '$RELEASE_SHA'"
          done
          printf 'Promoted signed revision `%s` to three drained HA backends.\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
